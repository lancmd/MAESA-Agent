interface:
  display_name: "Mining Area Ecological Workflow"
  short_description: "Run and package local mining-area GIS workflows"
  default_prompt: "Use $mining-area-ecological-space-analysis to inspect my local project, run or resume the enabled workflow, validate outputs, and package final artifacts safely."
dependencies:
  tools:
    - type: "mcp"
      value: "mining-gis"
      description: "Local ArcGIS, ENVI, PyTorch, PLUS, and InVEST execution service"
      transport: "streamable_http"
      url: "http://127.0.0.1:8765/mcp"
policy:
  allow_implicit_invocation: false
